---
# The repository's CI: every check, then the one gate that the ruleset requires ("CI gate / gate").
# Each check is its own workflow file (re-run a check from its run; there is no manual trigger) that calls the shared
# workflows of kokeb-labs/ci-tools at @v1; this file runs them together so a single gate can need all of them.
name: CI

on:
  push:
    branches: [main, 'release/*']
    tags: ['v*']
  pull_request:
    branches: [main, 'release/*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which files a pull request changes. A pull request that touches only documentation (docs/, figure models,
  # Markdown, the MkDocs and Doxygen configuration) cannot change a build, a test, a lint or a MISRA result, so it
  # runs only the docs and the repository checks; the gate allows exactly the code jobs to be skipped, and only
  # because of this job. Workflows, tools, sources and everything else run every job. Pushes to main, release
  # branches and tags always run everything (the release and the docs publish need it).
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      skippable: ${{ steps.diff.outputs.skippable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            code=false
            files=$(git diff --name-only "$BASE...$HEAD")
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                docs/*|*.md|_config/mkdocs.yml|_config/Doxyfile|mkdocs.yml) ;;
                *) code=true ;;
              esac
            done <<< "$files"
            [ -n "$files" ] || code=true
          fi
          skippable=""
          if [ "$code" = false ]; then
            skippable="host-tests quality cross misra lint"
            skippable="$skippable esp32"
          fi
          { echo "code=$code"; echo "skippable=$skippable"; } >> "$GITHUB_OUTPUT"
          echo "Code jobs run: $code"

  host-tests:
    name: Host tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/ci-host-tests.yml

  esp32:
    name: ESP32 examples
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/esp32-examples-build-ci.yml
    permissions:
      contents: read
      pull-requests: write

  docs:
    name: Docs
    uses: ./.github/workflows/ci-docs-publish.yml
    permissions:
      contents: write  # the publish job pushes gh-pages on main and tags; pull requests never publish

  quality:
    name: Host quality
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/ci-host-quality.yml
    permissions:
      contents: read

  cross:
    name: Cross-compile
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/ci-cross-build.yml
    permissions:
      contents: read

  misra:
    name: MISRA
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/ci-misra.yml
    permissions:
      contents: read

  lint:
    name: C++ lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/ci-cpp-lint.yml
    permissions:
      contents: read
      pull-requests: write

  # DCO (pull requests; elsewhere it passes with nothing to check), the org standard, Markdown and YAML lint, the
  # handbook rules, template drift (warns only) and cppcheck: steps of one job, billed as one.
  checks:
    name: Repository checks
    uses: ./.github/workflows/ci-repo-checks.yml
    permissions:
      contents: read
      pull-requests: read


  ci-gate:
    name: CI gate
    needs:
      - changes
      - host-tests
      - quality
      - cross
      - esp32
      - docs
      - lint
      - misra
      - checks
    if: always()
    uses: kokeb-labs/ci-tools/.github/workflows/ru-ci-gate.yml@v1
    permissions:
      contents: read
    with:
      needs_json: ${{ toJSON(needs) }}
      # Empty unless `changes` (which must pass) found a documentation-only pull request: then the code jobs it
      # names may be skipped, and every job that ran must still pass.
      allow_skipped: ${{ needs.changes.outputs.skippable }}
