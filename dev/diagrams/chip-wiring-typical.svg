<text x="50" y="1003.3" font-size="20" font-weight="700" fill="#9F1239">Supplies and ground</text>
<text x="50" y="1026.8" font-size="17" fill="#9F1239">+24V: VM · GND: GND, PGND, TRIGB; also U2.GND · +3V3 (no MAX22200 pin): U2.VDD · V18: V18</text>
<text x="50" y="1096.3" font-size="20" font-weight="700" fill="#334155">Also on the board</text>
<text x="50" y="1119.8" font-size="17" fill="#334155">Support parts: 5 capacitors, 3 resistors, 4 other parts around the supplies (values in the full schematic).</text>
<text x="32" y="1165.8" font-size="16" fill="#566070">* Not confirmed in the datasheet: net +3V3: the data sheet does not say where the pull-ups go; the MCU's logic supply is assumed; R1: an</text>
<text x="32" y="1188.8" font-size="16" fill="#566070">example inside the 15 kΩ to 100 kΩ range; 15 kΩ gives IFS = 1 A; R2: the application diagram shows the FAULT pull-up without a value; R3: the</text>
<text x="32" y="1211.9" font-size="16" fill="#566070">application diagram shows the SDO pull-up without a value.</text>
