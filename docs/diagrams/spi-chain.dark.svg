<text x="82" y="215.1" font-size="17" font-weight="700" fill="#BFDBFE">MCU</text>
<text x="82" y="242.8" font-size="15" fill="#D2DAE4">SPI controller</text>
<text x="82" y="336.1" font-size="17" font-weight="700" fill="#A7F3E6">MAX22200 B</text>
<text x="82" y="363.8" font-size="15" fill="#D2DAE4">first in the chain</text>
<text x="82" y="457.1" font-size="17" font-weight="700" fill="#A7F3E6">MAX22200 A</text>
<text x="82" y="484.8" font-size="15" fill="#D2DAE4">last in the chain</text>
<text x="118" y="289.5" font-size="15" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">MOSI → SDI</text>
<text x="118" y="410.5" font-size="15" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">SDO → SDI</text>
<text x="118" y="526" font-size="15" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">SDO → MISO</text>
<text x="489.2" y="186.6" font-size="14" font-weight="700" text-anchor="middle" fill="#E8EDF3">SCK</text>
<circle cx="489.2" cy="202.6" r="3.6" fill="#D2DAE4"/>
<circle cx="489.2" cy="323.6" r="3.6" fill="#D2DAE4"/>
<circle cx="489.2" cy="444.6" r="3.6" fill="#D2DAE4"/>
<text x="536.7" y="186.6" font-size="14" font-weight="700" text-anchor="middle" fill="#E8EDF3">CSB</text>
<circle cx="536.7" cy="212.6" r="3.6" fill="#D2DAE4"/>
<circle cx="536.7" cy="333.6" r="3.6" fill="#D2DAE4"/>
<circle cx="536.7" cy="454.6" r="3.6" fill="#D2DAE4"/>
<text x="584.2" y="186.6" font-size="14" font-weight="700" text-anchor="middle" fill="#E8EDF3">CMD</text>
<circle cx="584.2" cy="222.6" r="3.6" fill="#D2DAE4"/>
<circle cx="584.2" cy="343.6" r="3.6" fill="#D2DAE4"/>
<circle cx="584.2" cy="464.6" r="3.6" fill="#D2DAE4"/>
<text x="46" y="586.1" font-size="17" font-weight="700" fill="#E2E8F0">Limits</text>
<text x="46" y="606.5" font-size="15" fill="#E2E8F0">The SPI supports the daisy chain and can operate up to 5 MHz (SPI</text>
<text x="46" y="628.2" font-size="15" fill="#E2E8F0">Detailed Description; Figure 5, p. 23). SDI carries the command for</text>
<text x="46" y="650" font-size="15" fill="#E2E8F0">device A first, then the one for device B; SDO returns STATUS of A, then</text>
<text x="46" y="671.8" font-size="15" fill="#E2E8F0">B (Command Register Description (COMMAND); Figure 7, p. 26).</text>
</svg>
