<svg xmlns="http://www.w3.org/2000/svg" width="640" height="718" viewBox="0 0 640 718" role="img" aria-labelledby="spi-chain-title spi-chain-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="spi-chain-title">SPI daisy chain</title>
<desc id="spi-chain-desc">Daisy chain of two MAX22200 on one SPI bus: the MCU feeds SDI of device B, SDO of device B feeds SDI of device A and SDO of device A returns to the MCU, with SCK, CSB and CMD shared.</desc>
<defs><marker id="spi-chain-arrow-brand-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F4B942"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="717" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#F8D27A">SEVERAL CHIPS</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#E8EDF3">SPI daisy chain</text>
<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Datasheet: SPI Detailed Description; Figure 5, p. 23; Command Register</text>
<text x="32" y="124.5" font-size="15" fill="#9AA6B5">Description (COMMAND); Figure 7, p. 26.</text>
<rect x="32" y="140.4" width="576" height="1" fill="#252F3C"/>
