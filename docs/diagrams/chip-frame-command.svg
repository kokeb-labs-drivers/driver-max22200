<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="804" viewBox="0 0 1200 804" role="img" aria-labelledby="chip-frame-command-title chip-frame-command-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-frame-command-title">MAX22200: Command byte</title>
<desc id="chip-frame-command-desc">Command byte of the MAX22200, 8 bits, most significant bit first. Command: RB/W (bit 7), RFU (bits 6 to 5), A_BNK (bits 4 to 1), 8bit/n32bits (bit 0); Reply: STATUS[7:0] (bits 7 to 0). The STATUS[7:0] field of the Reply row: bit 7 OVT, bit 6 OCP, bit 5 OLF, bit 4 HHF, bit 3 DPM, bit 2 COMER, bit 1 UVM, bit 0 ACTIVE. Below, the SPI mode 0 waveform of one transfer in the same bit grid.</desc>
<rect x="0.5" y="0.5" width="1199" height="803" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">ON THE BUS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">MAX22200: Command byte</text>
<text x="32" y="115.4" font-size="18" fill="#566070">With CMD high, one byte chooses the register and the length of the transfers that follow; the reply is the fault byte. 8 bits,</text>
<text x="32" y="141.5" font-size="18" fill="#566070">sent most significant bit first. Datasheet: Command Register Description (COMMAND); Table 9, Figure 7, p. 26.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#E2E7EE"/>
