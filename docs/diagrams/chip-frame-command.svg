<text x="32" y="594.3" font-size="16" fill="#566070">SPI mode 0: SCK idles low; the chip samples its input on the rising edge and changes its output after the falling edge. CSB stays low for the</text>
<text x="32" y="617.5" font-size="16" fill="#566070">whole frame.</text>
<text x="32" y="660.9" font-size="20" font-weight="700" fill="#0E1726">STATUS[7:0], one flag per bit (datasheet Register Details: STATUS (0x00), p. 36)</text>
