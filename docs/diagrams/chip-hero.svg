<text x="508.8" y="819.4" font-size="16" fill="#566070">Benefits and Features, p. 1</text>
<text x="739.2" y="708.5" font-size="30" font-weight="700" fill="#0E1726">10 MHz</text>
<text x="739.2" y="738.1" font-size="17" fill="#2B3442">SPI clock, one chip</text>
<text x="739.2" y="761.1" font-size="17" fill="#2B3442">(5 MHz in a daisy</text>
<text x="739.2" y="784" font-size="17" fill="#2B3442">chain)</text>
