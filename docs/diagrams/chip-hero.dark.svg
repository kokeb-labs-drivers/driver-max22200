<text x="278.4" y="708.5" font-size="30" font-weight="700" fill="#E8EDF3">8 x 1 A</text>
<text x="278.4" y="738.1" font-size="17" fill="#D2DAE4">half-bridges, 1 A</text>
<text x="278.4" y="761.1" font-size="17" fill="#D2DAE4">RMS each</text>
<text x="278.4" y="819.4" font-size="16" fill="#9AA6B5">Benefits and Features, p. 1</text>
<text x="508.8" y="708.5" font-size="30" font-weight="700" fill="#E8EDF3">200 mΩ</text>
<text x="508.8" y="738.1" font-size="17" fill="#D2DAE4">typical on-resistance</text>
<text x="508.8" y="761.1" font-size="17" fill="#D2DAE4">per output</text>
<text x="508.8" y="819.4" font-size="16" fill="#9AA6B5">Benefits and Features, p. 1</text>
<text x="739.2" y="708.5" font-size="30" font-weight="700" fill="#E8EDF3">10 MHz</text>
<text x="739.2" y="738.1" font-size="17" fill="#D2DAE4">SPI clock, one chip</text>
<text x="739.2" y="761.1" font-size="17" fill="#D2DAE4">(5 MHz in a daisy</text>
<text x="739.2" y="784" font-size="17" fill="#D2DAE4">chain)</text>
<text x="739.2" y="819.4" font-size="16" fill="#9AA6B5">SPI timing (tCLK), p. 10</text>
<text x="969.6" y="708.5" font-size="30" font-weight="700" fill="#E8EDF3">5 x 5 mm</text>
<text x="969.6" y="738.1" font-size="17" fill="#D2DAE4">TQFN-32 body</text>
<text x="969.6" y="819.4" font-size="16" fill="#9AA6B5">Pin Configuration, p. 12</text>
