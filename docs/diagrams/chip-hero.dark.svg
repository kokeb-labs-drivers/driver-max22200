<text x="32" y="115.4" font-size="18" fill="#9AA6B5">What talks to it, what it drives and what it reads back, with its headline numbers. Datasheet: General Description;</text>
<text x="32" y="141.5" font-size="18" fill="#9AA6B5">Applications; Benefits and Features, p. 1.</text>
