<text x="788" y="347.5" font-size="17" fill="#D2DAE4">bridges</text>
<text x="421" y="492.5" font-size="20" font-weight="700" fill="#FDE68A">Reads back</text>
<text x="421" y="523.1" font-size="17" fill="#D2DAE4">Coil current (lossless sensing in each</text>
<text x="421" y="547.8" font-size="17" fill="#D2DAE4">half-bridge)</text>
<text x="421" y="572.4" font-size="17" fill="#D2DAE4">TRIGA and TRIGB (switch even and</text>
<text x="421" y="597.1" font-size="17" fill="#D2DAE4">odd channels)</text>
<text x="48" y="708.5" font-size="30" font-weight="700" fill="#E8EDF3">4.5 to 36 V</text>
<text x="48" y="738.1" font-size="17" fill="#D2DAE4">supply (VM)</text>
