<text x="82" y="215.1" font-size="17" font-weight="700" class="fk-f-blue-text">MCU</text>
<text x="82" y="242.8" font-size="15" class="fk-f-ink2">SPI controller</text>
<text x="82" y="336.1" font-size="17" font-weight="700" class="fk-f-teal-text">MAX22200 B</text>
<text x="82" y="363.8" font-size="15" class="fk-f-ink2">first in the chain</text>
<text x="82" y="457.1" font-size="17" font-weight="700" class="fk-f-teal-text">MAX22200 A</text>
<text x="82" y="484.8" font-size="15" class="fk-f-ink2">last in the chain</text>
<text x="118" y="289.5" font-size="15" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink2">MOSI → SDI</text>
<text x="118" y="410.5" font-size="15" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink2">SDO → SDI</text>
<text x="118" y="526" font-size="15" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink2">SDO → MISO</text>
