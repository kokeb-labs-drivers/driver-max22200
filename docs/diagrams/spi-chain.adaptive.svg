<text x="46" y="586.1" font-size="17" font-weight="700" class="fk-f-slate-text">Limits</text>
<text x="46" y="606.5" font-size="15" class="fk-f-slate-text">The SPI supports the daisy chain and can operate up to 5 MHz (SPI</text>
<text x="46" y="628.2" font-size="15" class="fk-f-slate-text">Detailed Description; Figure 5, p. 23). SDI carries the command for</text>
<text x="46" y="650" font-size="15" class="fk-f-slate-text">device A first, then the one for device B; SDO returns STATUS of A, then</text>
<text x="46" y="671.8" font-size="15" class="fk-f-slate-text">B (Command Register Description (COMMAND); Figure 7, p. 26).</text>
</svg>
