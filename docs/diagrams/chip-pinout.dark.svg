<title id="chip-pinout-title">MAX22200 pinout, TQFN-32</title>
<desc id="chip-pinout-desc">Pinout of the MAX22200 in TQFN-32, top view: 32 pins and an exposed pad, each with its name, its electrical type as a colour and the driver hook that uses it.</desc>
