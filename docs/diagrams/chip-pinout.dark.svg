<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Top view, pin 1 marked. Colour is the pin's electrical type; the mono text outside is the port hook the driver uses for it. Datasheet:</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">Pin Configuration, p. 12.</text>
