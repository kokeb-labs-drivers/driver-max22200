<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1058" viewBox="0 0 1200 1058" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the MAX22200 does</title>
<desc id="chip-capabilities-desc">Capability map of the MAX22200: Channel switching (supported): Switches each channel on or off with one 8-bit write of the ONCH byte, no read needed; HIT and HOLD sequence (supported): Pulls a plunger in at the HIT level for a set time, then holds it at a lower level to save power; CDR and VDR regulation (supported): Regulates the coil current against a full scale set by RREF, or the PWM duty cycle in 1 % steps; Chopping frequency and slew rate (supported): Sets the oscillator and each channel's chopping frequency, with slower edges for less EMI; Parallel and full-bridge pairs (supported): Ties two half-bridges for twice the current, or makes an H-bridge for a latched valve or a DC motor; Protection and fault flags (supported): Overcurrent, open load, HIT not reached, overtemperature, undervoltage: per-channel flags and FAULT; Detection of plunger movement (supported): Looks for the current dip a moving plunger makes during HIT, and flags a valve that did not move; Trigger inputs (partial): TRIGA and TRIGB switch even and odd channels directly; the driver selects them, your code drives the pins; Daisy chain (not covered): Several chips on one SPI chain at up to 5 MHz; the driver talks to one chip per object.</desc>
