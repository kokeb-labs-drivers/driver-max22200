---
# Driver metadata (handbook KB-REPO-018): kb-core's compatibility catalogue, the MCU gate, the kb tool and the
# configurator read it. CI checks name and version against cmake/max22200_build_settings.cmake.
name: max22200
version: 0.1.0
bus: [spi]          # spi, i2c, uart, adc, pio, gpio, can, canopen, modbus, onewire
mcus: [any]         # any, or the MCU families it needs, e.g. [esp32]
peripheral: null    # an MCU peripheral it needs with mcus, e.g. rmt
kb_core_min: null   # the oldest kb-core release whose handler works with this version; null until kb-core exists
authors: ["The driver-max22200 authors"]  # the copyright holder, as in LICENSE
language:           # the C++ standard, declared once; tools/check_language.py checks every place that repeats it
  standard: 20      # the minimum ISO C++ standard: a consumer needs at least this (docs/language-standard.md)
  profile: KB-CPP20          # the handbook profile of that standard
  profile_version: "1.0"     # the handbook release that defines it
  misra: "MISRA C++:2023"    # the MISRA edition the driver is analysed against
  compilers:                 # the oldest versions the driver promises to build with (quote them)
    gcc: "10"
    clang: "13"
  tested: [20]               # every standard CI compiles the headers under; includes the minimum
  effective_from: 2026-11-18 # the date this declaration took effect
